name: PoultryOps Email Automation

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-email-automation:
    name: Send trial lifecycle emails
    runs-on: ubuntu-latest

    steps:
      - name: Trigger email automation endpoint
        run: |
          HTTP_STATUS=$(curl -sS \
            -o response.json \
            -w "%{http_code}" \
            -X POST "${{ secrets.FRONTEND_URL }}/api/run-email-automation" \
            -H "x-automation-secret: ${{ secrets.AUTOMATION_SECRET }}" \
            -H "Content-Type: application/json")

          echo "========================================"
          echo "EMAIL AUTOMATION RESPONSE"
          echo "========================================"
          cat response.json
          echo ""
          echo "========================================"
          echo "HTTP STATUS: $HTTP_STATUS"
          echo "========================================"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Email automation endpoint returned $HTTP_STATUS"
            exit 1
          fi